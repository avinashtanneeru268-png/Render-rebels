services:
  - type: web
    name: sitesentinel-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build -w shared && npm run build -w backend
    startCommand: node backend/dist/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_MODE
        value: local
      - key: PORT
        value: 10000
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: CLIENT_URL
        value: https://render-rebels.vercel.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: inspection-media
